config:
  edition: 3

streams:
  catalogo_general:
    auto_subscribe: true
    queries:
      - SELECT * FROM productos WHERE eliminado_en IS NULL
      - SELECT * FROM clientes
      - SELECT * FROM configuracion
      - SELECT * FROM categorias_producto
      - SELECT * FROM cajas
      - SELECT * FROM maletas
      # El correo se sincroniza para poder validar de forma segura la contraseña
      # del administrador seleccionado sin pedir que escriba el correo.
      - SELECT id, nombre, apellido, email, rol, activo, vendedor_codigo, creado_en, actualizado FROM perfiles WHERE activo = true

  operaciones:
    auto_subscribe: true
    queries:
      - SELECT * FROM rutas
      - SELECT * FROM pedidos
      - SELECT * FROM pedido_detalle
      - SELECT * FROM inventario_movimientos
      - SELECT * FROM inventarios
      - SELECT * FROM inventario_detalle
      - SELECT * FROM inventario_participantes
      - SELECT * FROM inventario_aportes
